<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poste infirmier — Supervision IoMT</title>
  <style>
    :root {
      --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
      --ok:#22c55e; --warn:#f59e0b; --crit:#ef4444; --info:#3b82f6;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; border-bottom:1px solid var(--line);
        display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:18px; margin:0; font-weight:600; }
    .tick { font-size:11px; color:var(--muted); }
    main { padding:24px; display:grid; gap:24px; grid-template-columns:2fr 1fr; }
    @media (max-width:900px){ main{grid-template-columns:1fr;} }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
    .row { display:flex; justify-content:space-between; align-items:baseline; }
    .device { font-weight:600; font-size:15px; }
    .status { font-size:12px; padding:2px 8px; border-radius:6px; font-weight:600; }
    .status.RUNNING { background:rgba(34,197,94,.15); color:var(--ok); }
    .status.PAUSED  { background:rgba(59,130,246,.15); color:var(--info); }
    .status.COMPLETE{ background:rgba(148,163,184,.15); color:var(--muted); }
    .status.ALARM   { background:rgba(239,68,68,.15); color:var(--crit); }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
    .metric { background:rgba(0,0,0,.2); border-radius:8px; padding:8px 10px; }
    .metric .label { font-size:10px; color:var(--muted); text-transform:uppercase; }
    .metric .value { font-size:16px; font-weight:600; margin-top:2px; }
    .value.danger { color:var(--crit); }
    .alarm { border-left:3px solid var(--warn); padding:8px 12px; margin-bottom:8px;
        background:rgba(0,0,0,.15); border-radius:0 8px 8px 0; }
    .alarm.HAUTE { border-color:var(--crit); }
    .alarm.MOYENNE { border-color:var(--warn); }
    .alarm.BASSE { border-color:var(--info); }
    .alarm .t { font-size:11px; color:var(--muted); }
    .empty { color:var(--muted); font-size:14px; padding:20px; text-align:center; }

    /* HMI control styles */
    .hmi-control { margin-top:10px; display:flex; gap:8px; }
    .hmi-control input { flex:1; background:rgba(0,0,0,.2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 8px; }
    .hmi-control button { background:var(--info); border:none; color:white; border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>🏥 Poste infirmier — Supervision des perfusions</h1>
    <span class="tick" id="tick">—</span>
  </header>
  <main>
    <!-- 3D Pump view inserted above infusions -->
    <section>
      <h2>Pompe — Vue 3D</h2>
      <div class="card">
        <div style="display:flex; gap:1rem; align-items:flex-start;">
          <div id="pump3d-container" style="width:480px; height:320px; border:1px solid var(--line);"></div>
          <div style="flex:1">
            <div id="pump-overlay" style="font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;">
              <p><strong>Flow:</strong> <span id="pump-flow">—</span> mL/h</p>
              <p><strong>Phase:</strong> <span id="pump-phase">—</span></p>
              <p><strong>Status:</strong> <span id="pump-status">—</span></p>

              <div id="rate-control-placeholder" class="hmi-control">
                <input id="set-rate" type="number" min="0" placeholder="Débit mL/h" />
                <button id="set-rate-btn">Appliquer</button>
              </div>

              <div style="margin-top:1rem;">
                <button id="alarm-toggle" data-enabled="true">Disable alarms</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>Perfusions en cours</h2>
      <div id="infusions"><div class="empty">Chargement…</div></div>
    </section>
    <!-- Alarms side-panel removed: per-pump alarms shown on the 3D card -->
  </main>

  <script>
    const RATE_ALERT = 100; // débit au-delà duquel on affiche en rouge (utile pour la phase attaque)

    function statusClass(s){ if(!s) return ''; return s.startsWith('ALARM') ? 'ALARM' : s; }

    async function refresh(){
      try {
        const inf = await fetch('/data/infusions').then(r=>r.json());
        renderInfusions(inf);
        // Update the 3D pump if available
        if (window.Pump3D) {
          const pumpState = Array.isArray(inf) ? inf[0] : inf;
          window.Pump3D.updatePumpFromJSON(pumpState);
        }
        document.getElementById('tick').textContent = 'MàJ ' + new Date().toLocaleTimeString('fr-FR');
      } catch(e) { console.error(e); }
    }

    function renderInfusions(list){
      const el = document.getElementById('infusions');
      if(!list || list.length===0){ el.innerHTML='<div class="empty">Aucune perfusion active.</div>'; return; }
      el.innerHTML = list.map(o=>{
        const rate = o.flow_rate_ml_h ?? 0;
        const danger = rate >= RATE_ALERT ? ' danger' : '';
        const sc = statusClass(o.status);
        // Use device-specific input id to avoid duplicates when multiple cards are rendered.
        const inputId = 'rate-input-' + (o.device_id ?? Math.random().toString(36).slice(2,8));
        return `
          <div class="card">
            <div class="row">
              <span class="device">${o.device_id} — ${o.patient_id ?? 'N/A'}</span>
              <span class="status ${sc}">${o.status ?? '—'}</span>
            </div>
            <div class="metrics">
              <div class="metric"><div class="label">Phase</div><div class="value">${o.phase ?? '—'}</div></div>
              <div class="metric"><div class="label">Débit mL/h</div><div class="value${danger}">${rate.toFixed(1)}</div></div>
              <div class="metric"><div class="label">Restant mL</div><div class="value">${((o.volume_remaining_ml ?? 0).toFixed(0))}</div></div>
              <div class="metric"><div class="label">Batterie</div><div class="value">${((o.battery_pct ?? 0).toFixed(0))}%</div></div>
            </div>

            <div class="hmi-control">
              <input type="number" id="${inputId}" placeholder="Nouveau débit" step="1" min="0">
              <button onclick="setRate('${inputId}', '${o.device_id ?? ''}')">Appliquer</button>
            </div>
          </div>`;
      }).join('');
    }

    // Alarm list removed; current alarm state is surfaced on the 3D pump card overlay.
    // legacy setRate UI per-card. We keep it but prefer the central SET_RATE control above.
    async function setRate(inputId, deviceId) {
      const input = document.getElementById(inputId);
      if(!input) return;
      const val = parseFloat(input.value);
      if (isNaN(val)) return;
      const body = { rate: val };
      if (deviceId) body.device_id = deviceId;
      try {
        const res = await fetch('/data/set_rate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        console.log(data);
      } catch(e) {
        console.error('setRate failed', e);
      } finally {
        input.value = '';
      }
    }

    // Wire the 3D card controls
    document.addEventListener('DOMContentLoaded', function () {
      // Initialize Pump3D if available
      try { window.Pump3D = createPump3D(document.getElementById('pump3d-container')); } catch(e) { console.warn('Pump3D init failed', e); }

      document.getElementById('set-rate-btn').addEventListener('click', async () => {
        const rate = parseFloat(document.getElementById('set-rate').value);
        if (!Number.isFinite(rate)) return;
        await fetch('/data/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ verb: 'SET_RATE', args: [rate] })
        });
        document.getElementById('set-rate').value = '';
      });

      document.getElementById('alarm-toggle').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const enabled = btn.getAttribute('data-enabled') === 'true';
        const verb = enabled ? 'DISABLE_ALARM' : 'ENABLE_ALARM';
        await fetch('/data/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ verb })
        });
        btn.setAttribute('data-enabled', (!enabled).toString());
        btn.textContent = enabled ? 'Enable alarms' : 'Disable alarms';
      });
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
